<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jurnal Ringan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#eceee6;--card:#f8f9f4;--ink:#25332d;--muted:#6c7a72;--accent:#7b4b6a;--line:#b9c2b4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17201c;--card:#202b26;--ink:#e9eee4;--muted:#9aa9a0;--accent:#d49bc0;--line:#44544b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17201c;--card:#202b26;--ink:#e9eee4;--muted:#9aa9a0;--accent:#d49bc0;--line:#44544b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:22px 16px 60px}
h1{font:400 2rem/1.1 "Young Serif",Georgia,serif;margin:0}
#st{color:var(--muted);font-size:.82rem;margin:4px 0 14px}
nav{display:flex;gap:8px;margin-bottom:16px}
button,input,textarea{font:inherit;color:var(--ink)}
nav button{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 18px;cursor:pointer;font-weight:600}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.lab{font-size:.8rem;color:var(--muted);margin:14px 0 5px}
input[type=text],input[type=date],input[type=number],textarea,input:not([type]){width:100%;background:transparent;border:0;border-bottom:1.5px dotted var(--line);padding:6px 2px;outline:none}
input:focus,textarea:focus{border-bottom-color:var(--accent)}
textarea{resize:vertical;min-height:54px}
.row{display:flex;gap:8px;align-items:center}
.nb{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.mb{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:transparent;font-size:20px;cursor:pointer}
.mb.on{border-color:var(--ink);border-width:2.5px}
.hs{display:flex;gap:8px 16px;flex-wrap:wrap}
.hb{display:flex;gap:6px;align-items:center;cursor:pointer}
.ex{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dotted var(--line)}
.ex span{flex:1}.x{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer}
.tot{margin-top:12px;display:flex;justify-content:space-between;font-size:1.05rem}
.big{font:400 1.7rem "Young Serif",Georgia,serif;color:var(--accent)}
.hr{display:grid;grid-template-columns:62px 34px 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.hr .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.ml{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px}
.mg i{font-style:normal;font-size:.75rem;aspect-ratio:1;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.mg i.f{color:#25332d;border-color:transparent}
.sum{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0}
.sum div{font-size:.85rem;color:var(--muted)}.sum b{display:block;color:var(--ink);font-size:1.05rem}
.ttl{text-align:center;flex:1;font:400 1.15rem "Young Serif",Georgia,serif}
</style>
</head>
<body>
<main>
<h1>Jurnal Ringan</h1>
<div id="st">memuat…</div>
<nav>
<button data-a="tab" data-t="h">Hari ini</button>
<button data-a="tab" data-t="w">Minggu</button>
<button data-a="tab" data-t="m">Bulan</button>
</nav>
<div id="M"></div>
</main>
<script>
var MO=["😴","😐","🙂","😄","🥲"],MC=["#7f98b0","#d6c9a8","#95b08e","#e8c872","#c78aad"],MN=["capek","biasa","oke","senang","campur aduk"];
var HB=[["✍️","nulis"],["📖","baca"],["🔢","sudoku"],["🏺","clay"]],DN=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
var BL=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var $=function(i){return document.getElementById(i)},M=$("M");
var pad=function(n){return String(n).padStart(2,"0")};
var key=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var parse=function(k){var p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
var add=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var mon=function(d){return add(d,-((d.getDay()+6)%7))};
var rp=function(n){return "Rp"+Math.round(n).toLocaleString("id-ID")};
var sum=function(a){return(a||[]).reduce(function(s,e){return s+(+e.a||0)},0)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var now=new Date(),D={},col=null,LS="jurnal-ringan-v1",T={},where="";
var cur={tab:"h",day:key(now),wk:key(mon(now)),mo:now.getFullYear()+"-"+pad(now.getMonth()+1)};
function stat(t){$("st").textContent=t}
function save(id){clearTimeout(T[id]);stat("menyimpan…");T[id]=setTimeout(function(){
 if(col){col.doc(id).set(D[id]).then(function(){stat(where)},function(){stat("gagal menyimpan, coba lagi")})}
 else{try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}stat(where)}},500)}
function upd(id,fn){var v=JSON.parse(JSON.stringify(D[id]||{}));fn(v);D[id]=v;save(id)}
async function init(){
 try{var db=await claude.use("db"),u=await claude.use("user");
  if(db&&u){var uid=await u.id();col=db.collection("data/users/"+uid);where="tersimpan di akunmu";
   col.onSnapshot(function(s){var m={};s.docs.forEach(function(x){m[x.id]=x.data()});D=m;stat(where);
    if(!document.activeElement||!document.activeElement.matches("input,textarea"))render()},function(){stat("gagal memuat data")});
   render();return}}catch(e){}
 try{D=JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){D={}}
 where="tersimpan di perangkat ini saja";stat(where);render()}
function vToday(){var k=cur.day,d=D["d-"+k]||{},ex=d.ex||[],h=d.h||[0,0,0,0];
 return '<div class="sheet"><div class="row"><button class="nb" data-a="pd">‹</button><input type="date" id="dt" value="'+k+'"><button class="nb" data-a="nd">›</button></div>'
 +'<div class="lab">Mood</div><div class="moods">'+MO.map(function(m,i){return '<button class="mb'+(d.mood===i?" on":"")+'" data-a="mood" data-i="'+i+'" title="'+MN[i]+'" style="background:'+(d.mood===i?MC[i]:"transparent")+'">'+m+'</button>'}).join("")+'</div>'
 +'<div class="lab">Satu baris hari ini</div><input id="line" value="'+esc(d.line)+'" placeholder="boleh pendek, boleh jelek">'
 +'<div class="lab">Syukur kecil</div><input id="thx" value="'+esc(d.thanks)+'">'
 +'<div class="lab">Kecil-kecil hari ini</div><div class="hs">'+HB.map(function(x,i){return '<label class="hb"><input type="checkbox" data-a="hab" data-i="'+i+'"'+(h[i]?" checked":"")+'>'+x[0]+" "+x[1]+"</label>"}).join("")+'</div>'
 +'<div class="lab">Pengeluaran hari ini</div>'
 +ex.map(function(e,i){return '<div class="ex"><span>'+esc(e.n)+'</span><b>'+rp(e.a)+'</b><button class="x" data-a="dx" data-i="'+i+'">×</button></div>'}).join("")
 +'<div class="row" style="margin-top:8px"><input id="en" placeholder="beli apa"><input id="ea" type="number" inputmode="numeric" placeholder="jumlah" style="max-width:120px"><button class="nb" data-a="ax">Tambah</button></div>'
 +'<div class="tot"><span>Total hari ini</span><b>'+rp(sum(ex))+'</b></div></div>'}
function refl(s,k,f,lab,v){return '<div class="lab">'+lab+'</div><textarea data-s="'+s+'" data-k="'+k+'" data-f="'+f+'">'+esc(v)+'</textarea>'}
function vWeek(){var s=parse(cur.wk),w=D["w-"+cur.wk]||{},tot=0,fill=0,hc=[0,0,0,0],rows="";
 for(var i=0;i<7;i++){var d=add(s,i),k=key(d),x=D["d-"+k]||{},t=sum(x.ex);tot+=t;(x.h||[]).forEach(function(v,j){if(v)hc[j]++});if(x.mood!=null||x.line)fill++;
  rows+='<div class="hr" data-a="open" data-k="'+k+'"><span>'+DN[d.getDay()]+" "+d.getDate()+'</span><span class="ml" style="background:'+(x.mood!=null?MC[x.mood]:"transparent")+'">'+(x.mood!=null?MO[x.mood]:"")+'</span><span class="tx">'+esc(x.line)+'</span><span>'+(x.h||[]).map(function(v,j){return v?HB[j][0]:""}).join("")+'</span><b>'+(t?rp(t):"")+'</b></div>'}
 var e=add(s,6);
 return '<div class="sheet"><div class="row"><button class="nb" data-a="wp">‹</button><div class="ttl">'+s.getDate()+" "+BL[s.getMonth()].slice(0,3)+" – "+e.getDate()+" "+BL[e.getMonth()].slice(0,3)+'</div><button class="nb" data-a="wn">›</button></div>'
 +'<div class="sum"><div>Pengeluaran<b class="big">'+rp(tot)+'</b></div><div>Rata-rata per hari<b>'+rp(tot/7)+'</b></div><div>Hari terisi<b>'+fill+' / 7</b></div></div>'
 +'<div class="sum">'+HB.map(function(x,j){return '<div>'+x[0]+" "+x[1]+'<b>'+hc[j]+' hari</b></div>'}).join("")+'</div>'+rows+'</div>'
 +'<div class="sheet"><b>Refleksi minggu ini</b>'+refl("w",cur.wk,"best","Hal terbaik",w.best)+refl("w",cur.wk,"learn","Yang aku pelajari",w.learn)+refl("w",cur.wk,"next","3 hal kecil minggu depan",w.next)+'</div>'}
function vMonth(){var p=cur.mo.split("-").map(Number),y=p[0],m=p[1],n=new Date(y,m,0).getDate(),isC=y==now.getFullYear()&&m==now.getMonth()+1,upTo=isC?now.getDate():n,mo=D["m-"+cur.mo]||{},tot=0,hc=[0,0,0,0],wk={},cells="";
 for(var i=1;i<=n;i++){var k=y+"-"+pad(m)+"-"+pad(i),x=D["d-"+k]||{},t=sum(x.ex);tot+=t;(x.h||[]).forEach(function(v,j){if(v)hc[j]++});
  var wm=key(mon(parse(k)));wk[wm]=(wk[wm]||0)+t;
  cells+='<i class="'+(x.mood!=null?"f":"")+'" data-a="open" data-k="'+k+'" title="'+esc(x.line)+'" style="background:'+(x.mood!=null?MC[x.mood]:"transparent")+'">'+i+'</i>'}
 var ws=Object.keys(wk).sort().map(function(k){var d=parse(k);return '<div class="ex"><span>Pekan mulai '+d.getDate()+" "+BL[d.getMonth()].slice(0,3)+'</span><b>'+rp(wk[k])+'</b></div>'}).join("");
 return '<div class="sheet"><div class="row"><button class="nb" data-a="mp">‹</button><div class="ttl">'+BL[m-1]+" "+y+'</div><button class="nb" data-a="mn">›</button></div>'
 +'<div class="lab">Mood bulan ini (tap tanggal untuk membuka)</div><div class="mg">'+cells+'</div>'
 +'<div class="lab">Legenda: '+MN.map(function(t,i){return MO[i]+" "+t}).join(" · ")+'</div></div>'
 +'<div class="sheet"><div class="sum"><div>Total pengeluaran<b class="big">'+rp(tot)+'</b></div><div>Rata-rata per hari<b>'+rp(tot/upTo)+'</b></div></div>'
 +'<div class="lab">Per pekan (hanya hari di bulan ini)</div>'+ws
 +'<div class="lab">Kebiasaan</div><div class="sum">'+HB.map(function(x,j){return '<div>'+x[0]+" "+x[1]+'<b>'+hc[j]+' hari</b></div>'}).join("")+'</div></div>'
 +'<div class="sheet"><b>Refleksi bulan ini</b>'+refl("m",cur.mo,"high","Highlight bulan ini",mo.high)+refl("m",cur.mo,"target","Satu target kecil bulan depan",mo.target)+'</div>'}
function render(){M.innerHTML=({h:vToday,w:vWeek,m:vMonth})[cur.tab]();
 document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.t===cur.tab)})}
document.addEventListener("click",function(e){var t=e.target.closest("[data-a]");if(!t)return;var a=t.dataset.a,i=+t.dataset.i,id="d-"+cur.day;
 if(a=="tab")cur.tab=t.dataset.t;
 else if(a=="pd"||a=="nd")cur.day=key(add(parse(cur.day),a=="pd"?-1:1));
 else if(a=="mood")upd(id,function(v){v.mood=v.mood===i?null:i});
 else if(a=="hab")upd(id,function(v){v.h=v.h||[0,0,0,0];v.h[i]=t.checked?1:0});
 else if(a=="ax"){var n=$("en").value.trim(),amt=+$("ea").value;if(!amt)return;upd(id,function(v){(v.ex=v.ex||[]).push({n:n||"-",a:amt})})}
 else if(a=="dx")upd(id,function(v){v.ex.splice(i,1)});
 else if(a=="wp"||a=="wn")cur.wk=key(add(parse(cur.wk),a=="wp"?-7:7));
 else if(a=="mp"||a=="mn"){var p=cur.mo.split("-").map(Number),d=new Date(p[0],p[1]-1+(a=="mp"?-1:1),1);cur.mo=d.getFullYear()+"-"+pad(d.getMonth()+1)}
 else if(a=="open"){cur.day=t.dataset.k;cur.tab="h"}
 else return;
 render()});
M.addEventListener("input",function(e){var t=e.target;
 if(t.id=="line")upd("d-"+cur.day,function(v){v.line=t.value});
 else if(t.id=="thx")upd("d-"+cur.day,function(v){v.thanks=t.value});
 else if(t.dataset.f)upd(t.dataset.s+"-"+t.dataset.k,function(v){v[t.dataset.f]=t.value})});
M.addEventListener("change",function(e){if(e.target.id=="dt"&&e.target.value){cur.day=e.target.value;render()}});
render();init();
</script>
</body>
</html>
